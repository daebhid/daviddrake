<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Substitutes - David Drake</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --blue: #2e4a8c;
            --red: #c41e1e;
            --green: #2e8c4a;
            --white: #f5f5f0;
            --black: #1a1a1a;
            --grey: #666666;
            --grey-light: #e5e5e5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Open Sans', Arial, sans-serif;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.6;
            color: var(--blue);
            background: var(--white);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        a {
            color: var(--blue);
            text-decoration: none;
            transition: color 0.15s ease;
        }

        a:hover {
            color: var(--green);
        }

        a:visited {
            color: var(--blue);
        }

        a:visited:hover {
            color: var(--green);
        }

        .back-link {
            font-size: 14px;
            font-weight: 500;
            margin-top: 20px;
        }

        .page-container {
            max-width: 720px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .page-title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .description {
            margin-bottom: 20px;
            max-width: 100%;
            text-align: left;
        }

        .description p {
            margin-bottom: 1em;
        }

        .description p:last-child {
            margin-bottom: 0;
        }

        .content {
            width: 100%;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            cursor: pointer;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-poster {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .play-button {
            width: 68px;
            height: 48px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
        }

        .video-container:hover .play-button {
            background: rgba(0, 0, 0, 0.9);
        }

        .play-button:after {
            content: "";
            border-style: solid;
            border-width: 10px 0 10px 18px;
            border-color: transparent transparent transparent white;
            margin-left: 4px;
        }

        @media (max-width: 768px) {
            body {
                display: block;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 30px 20px;
            }

            .page-title {
                margin-bottom: 15px;
            }

            .description {
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="description">
            <p><u>Substitutes</u> by Sink Ya Teeth (2018) dir David Drake · dp Evy Lindberg</p>
        </div>
        
        <div class="content">
            <div class="video-container" id="video-container">
                <div class="video-poster" id="video-poster" style="background-image: url('images/sink_ya_teeth.png');">
                    <div class="play-button"></div>
                </div>
            </div>
        </div>
        
        <a href="index.html" class="back-link">Back</a>
    </div>

    <script>
        document.getElementById("video-container").onclick = function() {
            var poster = document.getElementById("video-poster");
            if (poster) {
                poster.style.display = "none";
                var iframe = document.createElement("iframe");
                iframe.src = "https://www.youtube.com/embed/SIzREq2V25U?rel=0&modestbranding=1&autoplay=1";
                iframe.allowFullscreen = true;
                iframe.allow = "autoplay";
                this.appendChild(iframe);
            }
        };
    </script>
</body>
</html>
