<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album Covers - David Drake</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --blue: #2e4a8c;
            --red: #c41e1e;
            --green: #2e8c4a;
            --white: #f5f5f0;
            --black: #1a1a1a;
            --grey: #666666;
            --grey-light: #e5e5e5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Open Sans', Arial, sans-serif;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.6;
            color: var(--blue);
            background: var(--white);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        a {
            color: var(--blue);
            text-decoration: none;
            transition: color 0.15s ease;
        }

        a:hover {
            color: var(--green);
        }

        a:visited {
            color: var(--blue);
        }

        a:visited:hover {
            color: var(--green);
        }

        .back-link {
            font-size: 14px;
            font-weight: 500;
            margin-top: 20px;
        }

        .page-container {
            max-width: 720px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .page-title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .description {
            margin-bottom: 20px;
            max-width: 100%;
            text-align: left;
        }

        .description p {
            margin-bottom: 1em;
        }

        .description p:last-child {
            margin-bottom: 0;
        }

        .title {
            font-weight: 500;
        }

        .slideshow-counter {
            font-weight: 400;
        }

        .content {
            width: 100%;
        }

        .slideshow {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .slideshow-image-container {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
        }

        .slideshow-image-container img {
            max-width: 100%;
            max-height: 60vh;
            object-fit: contain;
        }

        .slideshow-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            color: var(--blue);
            transition: color 0.15s ease;
            user-select: none;
        }

        .slideshow-nav:hover {
            color: var(--green);
        }

        .slideshow-prev {
            left: -50px;
        }

        .slideshow-next {
            right: -50px;
        }

        @media (max-width: 768px) {
            body {
                display: block;
            }

            .slideshow-prev {
                left: 0;
            }

            .slideshow-next {
                right: 0;
            }

            .slideshow-nav {
                background: rgba(245, 245, 240, 0.8);
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 30px 20px;
            }

            .page-title {
                margin-bottom: 15px;
            }

            .description {
                margin-bottom: 15px;
            }

            .slideshow-image-container img {
                max-height: 50vh;
            }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="description">
            <p><span class="title"><u>Album Covers</u></span> <span class="slideshow-counter" id="counter"></span> A variety of album covers photographed and created for The 1975, Haerts, Warner Music, Mad Decent, Sony, BMG, and Aesop.</p>
        </div>
        
        <div class="content">
            <div class="slideshow">
                <div class="slideshow-nav slideshow-prev" id="prev">&lt;</div>
                <div class="slideshow-image-container">
                    <img id="slideshow-image" src="" alt="Album Cover">
                </div>
                <div class="slideshow-nav slideshow-next" id="next">&gt;</div>
            </div>
        </div>
        
        <a href="index.html" class="back-link">Back</a>
    </div>

    <script>
        var images = [
            "images/DD_AlbumCovers_00001.jpg",
            "images/DD_AlbumCovers_00002.jpg",
            "images/DD_AlbumCovers_00004.jpg",
            "images/DD_AlbumCovers_00007.jpg",
            "images/DD_AlbumCovers_00010.jpg",
            "images/DD_AlbumCovers_00014.jpg",
            "images/DD_AlbumCovers_00015.jpg",
            "images/DD_AlbumCovers_00016.jpg",
            "images/DD_AlbumCovers_00017.jpg",
            "images/DD_AlbumCovers_00018.jpg",
            "images/DD_AlbumCovers_00019.jpg",
            "images/DD_AlbumCovers_00022.jpg",
            "images/DD_AlbumCovers_00025.jpg",
            "images/DD_AlbumCovers_00026.jpg",
            "images/DD_AlbumCovers_00028.jpg",
            "images/DD_AlbumCovers_00030.jpg",
            "images/DD_AlbumCovers_00032.jpg",
            "images/DD_AlbumCovers_00034.jpg"
        ];
        var currentIndex = 0;

        function updateSlideshow() {
            var img = document.getElementById("slideshow-image");
            var counter = document.getElementById("counter");
            img.src = images[currentIndex];
            counter.textContent = "(" + (currentIndex + 1) + "/" + images.length + ")";
        }

        document.getElementById("prev").onclick = function() {
            currentIndex--;
            if (currentIndex < 0) {
                currentIndex = images.length - 1;
            }
            updateSlideshow();
        };

        document.getElementById("next").onclick = function() {
            currentIndex++;
            if (currentIndex >= images.length) {
                currentIndex = 0;
            }
            updateSlideshow();
        };

        document.onkeydown = function(e) {
            if (e.key === "ArrowLeft") {
                currentIndex--;
                if (currentIndex < 0) {
                    currentIndex = images.length - 1;
                }
                updateSlideshow();
            } else if (e.key === "ArrowRight") {
                currentIndex++;
                if (currentIndex >= images.length) {
                    currentIndex = 0;
                }
                updateSlideshow();
            }
        };

        updateSlideshow();
    </script>
</body>
</html>
