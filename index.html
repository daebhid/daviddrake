<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>David Drake</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #151538;
            --red: #8B1A1A;
            --bg: #E8E0D0;
            --dw: max(100vw, calc(100vh * 1.6));
            --dh: max(100vh, calc(100vw / 2));
            --u: calc(var(--dw) * 0.01);
            --gutter: calc(3 * var(--u));
            --col-frac: 0.75;
            --img-frac: 0.5;
        }

        body.is-tablet {
            --col-frac: 0.6;
            --img-frac: 0.4;
            --dw: max(100vw, calc(100vh * 1.33));
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            height: 100%;
            overflow: auto;
        }

        body {
            font-family: 'Playfair Display', Georgia, serif;
            color: var(--navy);
            background: var(--bg);
            padding: var(--gutter);
            width: var(--dw);
            height: var(--dh);
        }

        .page {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .title {
            position: absolute;
            top: 0;
            left: 0;
            width: calc(var(--col-frac) * 100%);
            font-weight: 400;
            line-height: 0.92;
            letter-spacing: -0.02em;
            white-space: nowrap;
        }

        .menu {
            position: absolute;
            left: calc(var(--col-frac) * 100%);
            font-size: calc(1.19 * var(--u));
        }

        .menu-item {
            font-weight: 400;
            line-height: 1.55;
            cursor: pointer;
            transition: color 0.15s ease;
            user-select: none;
        }

        .menu-item:hover,
        .menu-item.active {
            color: var(--red);
        }

        .sub-items-row {
            position: absolute;
            left: 0;
            width: calc(var(--col-frac) * 100% - var(--gutter));
            display: flex;
            justify-content: space-between;
            font-size: calc(1.19 * var(--u));
            font-weight: 400;
            line-height: 1.55;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease;
        }

        .sub-items-row.visible {
            opacity: 1;
            visibility: visible;
        }

        .sub-item {
            cursor: pointer;
            transition: color 0.15s ease;
            user-select: none;
            white-space: nowrap;
            color: inherit;
            text-decoration: none;
        }

        .sub-item:hover,
        .sub-item.active {
            color: var(--red);
        }

        .sub-item.inactive {
            cursor: default;
            opacity: 0.4;
        }

        .sub-item.inactive:hover {
            color: inherit;
        }

        .content-image {
            position: absolute;
            left: 0;
            bottom: 0;
            width: calc(var(--img-frac) * 100%);
            height: 50%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
        }

        .content-image.gallery-mode,
        .content-image.cv-mode {
            width: calc(var(--col-frac) * 100% - var(--gutter));
        }

        .content-image.cv-mode {
            height: 37.5%;
        }

        .content-image.image-mode {
            width: auto;
            height: calc((var(--dw) - var(--gutter) * 2) * var(--img-frac) * 9 / 16);
            max-width: calc(var(--col-frac) * 100% - var(--gutter));
            display: flex;
            align-items: flex-end;
        }

        .content-image.image-mode img {
            height: 100%;
            width: auto;
            max-height: 100%;
            display: block;
        }

        .content-image.visible {
            opacity: 1;
            visibility: visible;
        }

        .content-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: bottom left;
            display: block;
        }

        .video-wrap {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            aspect-ratio: 16 / 9;
            cursor: pointer;
            background: #000;
            overflow: hidden;
        }

        .content-image .video-poster {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        .video-play {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: calc(4 * var(--u));
            height: calc(4 * var(--u));
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.6);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
            pointer-events: none;
        }

        .video-wrap:hover .video-play {
            background: rgba(0, 0, 0, 0.85);
        }

        .video-play::before {
            content: '';
            width: 0;
            height: 0;
            border-style: solid;
            border-width: calc(0.7 * var(--u)) 0 calc(0.7 * var(--u)) calc(1.1 * var(--u));
            border-color: transparent transparent transparent #fff;
            margin-left: calc(0.3 * var(--u));
        }

        .gallery {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none;
        }

        .gallery::-webkit-scrollbar {
            display: none;
        }

        .gallery-track {
            display: flex;
            height: 100%;
            align-items: flex-end;
            gap: calc(1 * var(--u));
            padding-right: calc(1 * var(--u));
        }

        .gallery-item {
            flex: 0 0 auto;
            height: 100%;
        }

        .gallery-item img {
            height: 100%;
            width: auto;
            display: block;
        }

        .cv-scroll {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none;
        }

        .cv-scroll::-webkit-scrollbar {
            display: none;
        }

        .cv-track {
            display: flex;
            height: 100%;
            align-items: flex-start;
            gap: calc(3 * var(--u));
            padding-right: calc(1 * var(--u));
        }

        .cv-card {
            flex: 0 0 auto;
            width: calc(28 * var(--u));
            max-height: 100%;
            overflow-y: auto;
            scrollbar-width: none;
            font-size: calc(1.19 * var(--u));
            line-height: 1.6;
            color: var(--navy);
        }

        .cv-card::-webkit-scrollbar {
            display: none;
        }

        .cv-card p {
            margin-bottom: 1em;
        }

        .cv-card p:last-child {
            margin-bottom: 0;
        }

        .cv-card a {
            color: var(--navy);
            text-decoration: underline;
            transition: color 0.15s ease;
        }

        .cv-card a:hover {
            color: var(--red);
        }

        .bio-text {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            font-size: calc(1.19 * var(--u));
            line-height: 1.6;
        }

        .bio-text p {
            margin-bottom: 1em;
        }

        .bio-text p:last-child {
            margin-bottom: 0;
        }

        .bio-text a {
            color: var(--navy);
            text-decoration: underline;
            transition: color 0.15s ease;
        }

        .bio-text a:hover {
            color: var(--red);
        }

        .video-wrap iframe {
            width: 100%;
            height: 100%;
            display: block;
            border: none;
        }

        .content-text {
            position: absolute;
            left: calc(var(--col-frac) * 100%);
            right: 0;
            bottom: 0;
            font-size: calc(0.795 * var(--u));
            line-height: 1.6;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
        }

        .content-text.visible {
            opacity: 1;
            visibility: visible;
        }

        .content-text p {
            margin-bottom: 1em;
        }

        .content-text p:last-child {
            margin-bottom: 0;
        }

        .content-text a {
            color: var(--navy);
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .content-text a:hover {
            color: var(--red);
        }

        .press-link {
            color: var(--red);
            text-decoration: none;
        }

        .press-link:hover {
            text-decoration: underline;
        }

        /* ---------- Mobile view ---------- */

        .mobile-view { display: none; }

        body.is-mobile {
            width: 100%;
            height: auto;
            min-height: 100%;
            padding: 6vw;
            overflow-x: hidden;
        }

        body.is-mobile .page { display: none; }
        body.is-mobile .mobile-view { display: block; }

        .m-title {
            text-align: center;
            font-family: 'Playfair Display', Georgia, serif;
            color: var(--navy);
            font-weight: 400;
            font-size: 16vw;
            line-height: 1;
            letter-spacing: -0.02em;
        }

        .m-burger {
            display: block;
            margin: 10vw auto 0;
            width: 14vw;
            height: 14vw;
            background: none;
            border: none;
            position: relative;
            cursor: pointer;
        }

        .m-burger span {
            position: absolute;
            left: 10%;
            right: 10%;
            height: 2px;
            background: var(--navy);
            transition: transform 0.25s ease, opacity 0.25s ease, top 0.25s ease;
        }

        .m-burger span:nth-child(1) { top: 30%; }
        .m-burger span:nth-child(2) { top: 50%; }
        .m-burger span:nth-child(3) { top: 70%; }

        .m-burger.open span:nth-child(1) { top: 50%; transform: rotate(45deg); }
        .m-burger.open span:nth-child(2) { opacity: 0; }
        .m-burger.open span:nth-child(3) { top: 50%; transform: rotate(-45deg); }

        .m-menu {
            margin-top: 8vw;
            text-align: center;
            display: none;
        }

        .m-menu.open { display: block; }

        .m-menu button,
        .m-menu a {
            display: block;
            width: 100%;
            padding: 3vw 0;
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 7vw;
            color: var(--navy);
            background: none;
            border: none;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
        }

        .m-menu button:active,
        .m-menu button.active {
            color: var(--red);
        }

        .m-menu button.inactive {
            opacity: 0.4;
            cursor: default;
        }

        .m-menu .m-back {
            font-size: 5vw;
            color: var(--red);
        }

        .m-content {
            margin-top: 8vw;
        }

        .m-content:empty { margin-top: 0; }

        .m-video-wrap,
        .m-video-wrap iframe,
        .m-video-wrap img {
            display: block;
            width: 100%;
        }

        .m-video-wrap {
            position: relative;
            aspect-ratio: 16 / 9;
            background: #000;
            cursor: pointer;
            overflow: hidden;
        }

        .m-video-wrap img {
            height: 100%;
            object-fit: cover;
        }

        .m-video-wrap iframe {
            height: 100%;
            border: 0;
        }

        .m-video-wrap .m-play {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 15vw;
            height: 15vw;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.6);
            border: 0;
            color: white;
            font-size: 6vw;
            pointer-events: none;
        }

        .m-image {
            display: block;
            width: 100%;
            height: auto;
        }

        .m-gallery {
            display: flex;
            flex-direction: column;
            gap: 3vw;
        }

        .m-text + .m-gallery { margin-top: 6vw; }

        .m-gallery img {
            width: 100%;
            height: auto;
            display: block;
        }

        .m-text,
        .m-bio,
        .m-cv {
            font-family: 'Playfair Display', Georgia, serif;
            color: var(--navy);
            margin-top: 5vw;
            font-size: 4.2vw;
            line-height: 1.55;
        }

        .m-text p,
        .m-bio p,
        .m-cv p { margin-bottom: 1em; }

        .m-text p:last-child,
        .m-bio p:last-child,
        .m-cv p:last-child { margin-bottom: 0; }

        .m-text a,
        .m-bio a,
        .m-cv a {
            color: var(--navy);
            text-decoration: underline;
        }

        .m-text .press-link { color: var(--red); }
    </style>
</head>
<body>

    <div class="mobile-view" id="mobile-view">
        <h1 class="m-title">David Drake</h1>
        <button class="m-burger" id="m-burger" aria-label="Menu">
            <span></span><span></span><span></span>
        </button>
        <nav class="m-menu" id="m-menu"></nav>
        <section class="m-content" id="m-content"></section>
    </div>

    <div class="page" id="page">
        <h1 class="title" id="title">David Drake</h1>

        <nav class="menu" id="menu">
            <div class="menu-item" data-section="film">Film</div>
            <div class="menu-item" data-section="video">Video</div>
            <div class="menu-item" data-section="photo">Photo</div>
            <div class="menu-item" data-section="info">Info</div>
        </nav>

        <div class="sub-items-row" id="sub-items"></div>

        <div class="content-image" id="content-image"></div>

        <div class="content-text" id="content-text"></div>
    </div>

    <script>
        const sections = {
            film: [
                { name: 'The Long Haul', active: true },
                { name: 'Left Over', active: true },
                { name: 'Post 398', active: true },
                { name: 'Early Worm', active: true },
                { name: 'A Foot of Turf', active: true },
                { name: 'Party Wall', active: true }
            ],
            video: [
                { name: 'Offline', active: true },
                { name: 'Nevermind', active: true },
                { name: 'Live Footage', active: true },
                { name: 'Fatherland', active: true },
                { name: 'Crabshells', active: true },
                { name: 'Zach Said', active: true },
                { name: 'Substitutes', active: true }
            ],
            photo: [
                { name: 'Commissions', active: true },
                { name: 'Album Covers', active: true },
                { name: 'Common Era', active: true },
                { name: 'Carousel', active: true },
                { name: 'Sailing Stones', active: true },
                { name: 'A Burning Cloud', active: true },
                { name: 'Avec Pi', active: true }
            ],
            info: [
                { name: 'About', active: true },
                { name: 'Mentorship', active: true },
                { name: 'Workshop', active: true },
                { name: 'CV', active: true },
                { name: 'Instagram', href: 'https://instagram.com/davidndrake' }
            ]
        };

        const OLD_IMG = 'images/';

        function posterFor(url) {
            const yt = url.match(/youtube\.com\/embed\/([^?&/]+)/);
            if (yt) return `https://img.youtube.com/vi/${yt[1]}/hqdefault.jpg`;
            const vm = url.match(/vimeo\.com\/video\/([^?&/]+)/);
            if (vm) return `https://vumbnail.com/${vm[1]}.jpg`;
            return null;
        }

        function range(prefix, start, end, pad) {
            const arr = [];
            for (let i = start; i <= end; i++) {
                arr.push(prefix + String(i).padStart(pad, '0') + '.jpg');
            }
            return arr;
        }

        const content = {
            'The Long Haul': {
                image: 'posters/the-long-haul.PNG',
                imageAlt: 'The Long Haul',
                text: `<p><u>The Long Haul</u> is the debut feature film written and directed by David Drake. It shot in early 2025 and stars Margo Martindale, Cole Sprouse, Stephen Root, and Yalitza Aparicio. It was produced by Braintrust and Spiral Stairs.</p>
                <p>The film follows CJ Montague, a long-haul truck driver in Idaho who is facing retirement and the potential paroling of a prisoner who destroyed her life 25 years earlier.</p>
                <p>The film was formerly known as Dead Letters in its press releases: <a class="press-link" href="https://deadline.com/2025/03/margo-martindale-dead-letters-first-look-photo-1236351909/" target="_blank">Deadline</a>, <a class="press-link" href="https://variety.com/2025/film/news/margo-martindale-dead-letters-wraps-production-1236349418/" target="_blank">Variety</a>, and <a class="press-link" href="https://www.hollywoodreporter.com/movies/movie-news/margo-martindale-stars-as-truck-driver-in-dead-letters-1236173715/" target="_blank">THR</a>.</p>`
            },
            'Left Over': {
                video: 'https://player.vimeo.com/video/746423508',
                poster: 'posters/left-over.jpg',
                text: `<p><u>Left Over</u> (2021) is a BFI Network supported short film written and directed by David Drake. It stars Chloe Pirrie and Ian Hart. It was selected as a Vimeo Staff Pick in 2022. The film follows Nel as she packs up her late father's home, while simultaneously unpacking memories of their volatile relationship.</p>`
            },
            'Post 398': {
                video: 'https://player.vimeo.com/video/527164103',
                poster: 'posters/post-398.jpg',
                text: `<p><u>Post 398</u> (2019) is a short documentary directed by David Drake about a Harlem jazz room situated in the basement of a veterans association. The band tries to keep the place going after the death of its founder.</p>`
            },
            'Early Worm': {
                video: 'https://player.vimeo.com/video/375340653',
                text: `<p><u>Early Worm</u> (2019) is a short film written and directed by David Drake about a man named Charlie who gets a job leafleting, and within a few short hours he is breaking into the house of a childhood friend.</p>`
            },
            'A Foot of Turf': {
                video: 'https://player.vimeo.com/video/309097061',
                poster: 'posters/a-foot-of-turf.jpg',
                text: `<p><u>A Foot of Turf</u> (2018) is a short documentary directed by David Drake. It was featured on NOWNESS and won best short film at the Manlleu International Film Festival in Catalonia. The film documents a remote island's economic downturn and how islanders both near and far return every week to watch their beloved soccer team.</p>`
            },
            'Party Wall': {
                video: 'https://player.vimeo.com/video/291566185',
                poster: 'posters/party-wall.jpg',
                text: `<p><u>Party Wall</u> (2017) is a short film written and directed by David Drake. Featured on No Budge. It follows the life of a self-help vlogger who has shut herself away from the outside world. Her only means of interfacing with others is a laptop, mobile phone, and the walls of her home.</p>`
            },
            'Offline': {
                video: 'https://player.vimeo.com/video/399813164',
                poster: 'posters/offline.jpg',
                text: `<p><u>Offline</u> by Alex Kozobolis (2020)<br>dir David Drake · dp Evy Lindberg</p>`
            },
            'Nevermind': {
                video: 'https://www.youtube.com/embed/esv8O2hD9hU?rel=0&modestbranding=1',
                text: `<p><u>Nevermind</u> by IDER (2017)<br>dir David Drake · dp Evy Lindberg</p>`
            },
            'Live Footage': {
                video: 'https://player.vimeo.com/video/154831464',
                text: `<p><u>View From a Desert Helicopter</u> by Live Footage (2016)<br>dir David Drake · sfx Dan Tombs</p>`
            },
            'Fatherland': {
                video: 'https://player.vimeo.com/video/265724166',
                poster: 'posters/fatherland.jpg',
                text: `<p><u>Fatherland</u> by Kele Okereke (2019)<br>dir David Drake · dp Evy Lindberg</p>`
            },
            'Crabshells': {
                video: 'https://player.vimeo.com/video/303471802',
                text: `<p><u>Crabshells</u> by Aniseed (2018)<br>dir David Drake · dp Evy Lindberg</p>`
            },
            'Substitutes': {
                video: 'https://www.youtube.com/embed/SIzREq2V25U?rel=0&modestbranding=1',
                text: `<p><u>Substitutes</u> by Sink Ya Teeth (2018)<br>dir David Drake · dp Evy Lindberg</p>`
            },
            'Zach Said': {
                video: 'https://player.vimeo.com/video/296845657',
                poster: 'posters/zach-said.jpg',
                text: `<p><u>Catch a Feeling</u> by Zach Said (2018)<br>dir David Drake · dp Evy Lindberg</p>`
            },
            'Commissions': {
                images: range('photos', 1, 29, 5),
                text: `<p><u>Commissions</u> — A selection of commissioned works created for The 1975, Tom Grennan, Django Django, Zach Said, and others.</p>`
            },
            'Album Covers': {
                images: [1,2,4,7,10,14,15,16,17,18,19,22,25,26,28,30,32,34].map(n => `DD_AlbumCovers_${String(n).padStart(5,'0')}.jpg`),
                text: `<p><u>Album Covers</u> — A variety of album covers photographed and created for The 1975, Haerts, Warner Music, Mad Decent, Sony, BMG, and Aesop.</p>`
            },
            'Common Era': {
                images: range('commonera_', 1, 20, 2),
                text: `<p><u>Common Era</u> — A collection of photographs by David Drake, exhibited at the Norwich Arts Centre.</p>`
            },
            'Carousel': {
                images: Array.from({length: 12}, (_, i) => `Carousel${i+1}.jpg`),
                text: `<p><u>Carousel</u> — A series of physically manipulated medium format photographs, self published as a zine.</p>`
            },
            'Sailing Stones': {
                images: range('sailingstones_', 1, 9, 2),
                text: `<p><u>Sailing Stones</u> — A series of medium format photographs and short story created by David Drake. The images were taken in Death Valley, California. The pamphlet was published by Chloride City.</p>`
            },
            'A Burning Cloud': {
                images: range('abc', 1, 23, 5),
                text: `<p><u>A Burning Cloud</u> — A collection of 35mm, medium format, and digital photographs created by David Drake a decade apart. The photos were self-published as a soft cover monograph.</p>`
            },
            'Avec Pi': {
                images: range('avec', 1, 33, 5),
                text: `<p><u>Avec Pi</u> — A series of 35mm black and white photographs, taken across East Anglia (UK) and Nouvelle-Aquitaine (France). The series was published as a hard cover photobook by Chloride City.</p>`
            },
            'About': {
                bio: `<p>David Drake (b. 1986, New York) is a self-taught American filmmaker and photographer based in the UK. His debut feature The Long Haul is being produced by Helene Sifre (Blue Jean, 2022), Sam Bank, and Juliet Berman. His BFI Network supported short film Left Over stars Chloe Pirrie and Ian Hart, and was selected as a Vimeo Staff Pick in 2022. David is currently developing a further two feature projects with Braintrust, as well as his own slate of original projects through his production company <a href="https://pylon.film" target="_blank">Pylon</a>.</p>

        let activeSection = null;
        let activeSubItem = null;

        const page = document.getElementById('page');
        const titleEl = document.getElementById('title');
        const menuEl = document.getElementById('menu');
        const menuItems = document.querySelectorAll('.menu-item');
        const subItemsEl = document.getElementById('sub-items');
        const contentImage = document.getElementById('content-image');
        const contentText = document.getElementById('content-text');

        function sizeTitle() {
            const targetWidth = page.offsetWidth * 0.75;
            let fontSize = targetWidth / 5.5;
            titleEl.style.fontSize = fontSize + 'px';
            const actualWidth = titleEl.offsetWidth;
            fontSize = fontSize * (targetWidth / actualWidth);
            titleEl.style.fontSize = fontSize + 'px';
        }

        function positionMenu() {
            const titleHeight = titleEl.offsetHeight;
            menuEl.style.top = (titleHeight * 1.15) + 'px';
        }

        function positionSubItems() {
            const activeMenuItem = menuEl.querySelector('.menu-item.active');
            if (!activeMenuItem) return;
            const menuItemTop = activeMenuItem.getBoundingClientRect().top;
            const pageTop = page.getBoundingClientRect().top;
            subItemsEl.style.top = (menuItemTop - pageTop) + 'px';
        }

        let activeGallery = null;
        let galleryCopyWidth = 0;
        let suppressJump = false;
        let arrowTimeout = null;

        function setupInfiniteScroll(scroller, itemEls, N) {
            let copyWidth = 0;
            let jumping = false;

            function measure() {
                copyWidth = itemEls[N] ? itemEls[N].offsetLeft : 0;
                galleryCopyWidth = copyWidth;
                if (scroller.scrollLeft === 0 && copyWidth > 0) {
                    jumping = true;
                    scroller.scrollLeft = copyWidth;
                    jumping = false;
                }
            }

            scroller.addEventListener('scroll', () => {
                if (!jumping && !suppressJump && copyWidth > 0) {
                    const scrollL = scroller.scrollLeft;
                    if (scrollL < copyWidth * 0.5) {
                        jumping = true;
                        scroller.scrollLeft = scrollL + copyWidth;
                        jumping = false;
                    } else if (scrollL > copyWidth * 2.5) {
                        jumping = true;
                        scroller.scrollLeft = scrollL - copyWidth;
                        jumping = false;
                    }
                }
            }, { passive: true });

            scroller.addEventListener('wheel', (e) => {
                if (Math.abs(e.deltaX) >= Math.abs(e.deltaY)) return;
                if (e.deltaY === 0) return;
                e.preventDefault();
                scroller.scrollLeft += e.deltaY;
            }, { passive: false });

            window.addEventListener('resize', measure);
            return measure;
        }

        function renderGallery(images) {
            const tripled = [...images, ...images, ...images];
            const items = tripled.map(f => `<div class="gallery-item"><img src="${OLD_IMG + f}" alt=""></div>`).join('');
            contentImage.innerHTML = `<div class="gallery"><div class="gallery-track">${items}</div></div>`;
            contentImage.classList.add('gallery-mode');
            const gallery = contentImage.querySelector('.gallery');
            const els = Array.from(contentImage.querySelectorAll('.gallery-item'));
            activeGallery = gallery;

            const measure = setupInfiniteScroll(gallery, els, images.length);

            const imgs = contentImage.querySelectorAll('img');
            let loaded = 0;
            imgs.forEach(img => {
                if (img.complete) { loaded++; }
                else { img.addEventListener('load', () => { loaded++; if (loaded === imgs.length) measure(); }); }
            });
            measure();
        }

        function renderCVCards(items) {
            const tripled = [...items, ...items, ...items];
            const cards = tripled.map(html => `<div class="cv-card">${html}</div>`).join('');
            contentImage.innerHTML = `<div class="cv-scroll"><div class="cv-track">${cards}</div></div>`;
            contentImage.classList.add('cv-mode');
            const scroller = contentImage.querySelector('.cv-scroll');
            const els = Array.from(contentImage.querySelectorAll('.cv-card'));
            activeGallery = scroller;

            const measure = setupInfiniteScroll(scroller, els, items.length);
            measure();
        }

        function resetAll() {
            activeSection = null;
            activeSubItem = null;
            activeGallery = null;
            contentImage.classList.remove('gallery-mode');
            contentImage.classList.remove('image-mode');
            contentImage.classList.remove('cv-mode');
            menuItems.forEach(m => m.classList.remove('active'));
            subItemsEl.classList.remove('visible');
            subItemsEl.innerHTML = '';
            contentImage.classList.remove('visible');
            contentImage.innerHTML = '';
            contentText.classList.remove('visible');
            contentText.innerHTML = '';
        }

        function showContent(name) {
            const data = content[name];
            if (!data) return;
            activeSubItem = name;
            activeGallery = null;
            contentImage.classList.remove('gallery-mode', 'image-mode', 'cv-mode');

            document.querySelectorAll('.sub-item').forEach(s => {
                s.classList.toggle('active', s.textContent === name);
            });

            if (data.video) {
                const poster = data.poster || posterFor(data.video);
                if (poster) {
                    contentImage.innerHTML = `<div class="video-wrap" data-src="${data.video}"><img class="video-poster" src="${poster}" alt=""><button class="video-play" aria-label="Play"></button></div>`;
                    contentImage.querySelector('.video-wrap').addEventListener('click', function(e) {
                        e.stopPropagation();
                        const src = this.dataset.src + (this.dataset.src.includes('?') ? '&' : '?') + 'autoplay=1';
                        this.innerHTML = `<iframe src="${src}" allowfullscreen frameborder="0" allow="autoplay"></iframe>`;
                    });
                } else {
                    contentImage.innerHTML = `<div class="video-wrap"><iframe src="${data.video}" allowfullscreen frameborder="0"></iframe></div>`;
                }
                contentImage.classList.add('visible');
            } else if (data.images) {
                renderGallery(data.images);
                contentImage.classList.add('visible');
            } else if (data.cv) {
                renderCVCards(data.cv);
                contentImage.classList.add('visible');
            } else if (data.image) {
                contentImage.innerHTML = `<img src="${data.image}" alt="${data.imageAlt}">`;
                contentImage.classList.add('visible');
                contentImage.classList.add('image-mode');
            } else if (data.bio) {
                contentImage.innerHTML = `<div class="bio-text">${data.bio}</div>`;
                contentImage.classList.add('visible');
            } else {
                contentImage.innerHTML = '';
                contentImage.classList.remove('visible');
            }
            if (data.text) {
                contentText.innerHTML = data.text;
                contentText.classList.add('visible');
            } else {
                contentText.innerHTML = '';
                contentText.classList.remove('visible');
            }
        }

        function showSubItems(section) {
            const items = sections[section];
            if (!items || items.length === 0) return;

            activeSection = section;

            menuItems.forEach(m => {
                m.classList.toggle('active', m.dataset.section === section);
            });

            subItemsEl.innerHTML = '';
            items.forEach(item => {
                let el;
                if (item.href) {
                    el = document.createElement('a');
                    el.href = item.href;
                    el.target = '_blank';
                    el.rel = 'noopener';
                } else {
                    el = document.createElement('span');
                    if (item.active) {
                        el.addEventListener('click', (e) => {
                            e.stopPropagation();
                            showContent(item.name);
                        });
                    } else {
                        el.classList.add('inactive');
                    }
                }
                el.classList.add('sub-item');
                el.textContent = item.name;
                subItemsEl.appendChild(el);
            });

            subItemsEl.classList.add('visible');
            positionSubItems();
            contentImage.classList.remove('visible');
            contentText.classList.remove('visible');
            activeSubItem = null;
        }

        menuItems.forEach(item => {
            item.addEventListener('click', (e) => {
                e.stopPropagation();
                const section = item.dataset.section;

                if (activeSection === section) {
                    resetAll();
                    return;
                }

                resetAll();
                showSubItems(section);
            });
        });

        document.addEventListener('keydown', (e) => {
            if (!activeGallery || !activeGallery.isConnected) return;
            if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
            const dir = e.key === 'ArrowRight' ? 1 : -1;
            const scrollL = activeGallery.scrollLeft;
            const items = Array.from(activeGallery.querySelectorAll('.gallery-item, .cv-card'));
            let target;
            if (dir === 1) {
                target = items.find(el => el.offsetLeft > scrollL + 5);
            } else {
                target = [...items].reverse().find(el => el.offsetLeft < scrollL - 5);
            }
            if (!target) return;
            suppressJump = true;
            activeGallery.scrollTo({ left: target.offsetLeft, behavior: 'smooth' });
            clearTimeout(arrowTimeout);
            arrowTimeout = setTimeout(() => {
                suppressJump = false;
                const sl = activeGallery.scrollLeft;
                if (galleryCopyWidth > 0) {
                    if (sl < galleryCopyWidth * 0.5) activeGallery.scrollLeft = sl + galleryCopyWidth;
                    else if (sl > galleryCopyWidth * 2.5) activeGallery.scrollLeft = sl - galleryCopyWidth;
                }
            }, 600);
        });

        document.addEventListener('click', (e) => {
            if (e.target.closest('.menu') || e.target.closest('.sub-items-row') || e.target.closest('.content-image')) return;
            resetAll();
        });

        function layout() {
            sizeTitle();
            positionMenu();
            if (activeSection) positionSubItems();
        }

        layout();
        window.addEventListener('resize', layout);

        /* ---------- Mobile layout ---------- */

        const MOBILE_MQ = window.matchMedia('(pointer: coarse), (max-width: 600px)');
        const SECTION_LABELS = { film: 'Film', video: 'Video', photo: 'Photo', info: 'Info' };

        const mBurger = document.getElementById('m-burger');
        const mMenu = document.getElementById('m-menu');
        const mContent = document.getElementById('m-content');

        let mMenuOpen = false;
        let mSubSection = null;

        function setDeviceMode() {
            document.body.classList.toggle('is-mobile', MOBILE_MQ.matches);
            document.body.classList.remove('is-tablet');
        }
        setDeviceMode();
        MOBILE_MQ.addEventListener('change', setDeviceMode);

        function renderMobileMenu() {
            mBurger.classList.toggle('open', mMenuOpen);
            if (!mMenuOpen) {
                mMenu.classList.remove('open');
                mMenu.innerHTML = '';
                return;
            }
            mMenu.classList.add('open');
            if (mSubSection) {
                const items = sections[mSubSection];
                mMenu.innerHTML = `<button class="m-back" data-back="1">← ${SECTION_LABELS[mSubSection]}</button>` +
                    items.map(i => {
                        if (i.href) {
                            return `<a href="${i.href}" target="_blank" rel="noopener">${i.name}</a>`;
                        }
                        if (i.active === false) {
                            return `<button class="inactive" disabled>${i.name}</button>`;
                        }
                        return `<button data-name="${i.name}">${i.name}</button>`;
                    }).join('');
            } else {
                mMenu.innerHTML = Object.keys(SECTION_LABELS).map(s =>
                    `<button data-section="${s}">${SECTION_LABELS[s]}</button>`).join('');
            }
        }

        mBurger.addEventListener('click', () => {
            mMenuOpen = !mMenuOpen;
            if (!mMenuOpen) mSubSection = null;
            renderMobileMenu();
        });

        mMenu.addEventListener('click', (e) => {
            const t = e.target;
            if (t.dataset.back) { mSubSection = null; renderMobileMenu(); return; }
            if (t.dataset.section) {
                mSubSection = t.dataset.section;
                renderMobileMenu();
                return;
            }
            if (t.dataset.name) {
                showMobileContent(t.dataset.name);
                mMenuOpen = false; mSubSection = null; renderMobileMenu();
            }
        });

        function showMobileContent(name) {
            const data = content[name];
            if (!data) return;
            let html = '';
            if (data.images && data.text) {
                html += `<div class="m-text">${data.text}</div>`;
            }
            if (data.video) {
                const poster = data.poster || posterFor(data.video);
                if (poster) {
                    html += `<div class="m-video-wrap" data-src="${data.video}"><img src="${poster}" alt=""><button class="m-play">▶</button></div>`;
                } else {
                    html += `<div class="m-video-wrap"><iframe src="${data.video}" allowfullscreen></iframe></div>`;
                }
            } else if (data.images) {
                html += `<div class="m-gallery">${data.images.map(f => `<img src="${OLD_IMG + f}" alt="">`).join('')}</div>`;
            } else if (data.cv) {
                html += `<div class="m-cv">${data.cv.map(p => `<p>${p}</p>`).join('')}</div>`;
            } else if (data.image) {
                html += `<img class="m-image" src="${data.image}" alt="${data.imageAlt || ''}">`;
            } else if (data.bio) {
                html += `<div class="m-bio">${data.bio}</div>`;
            }
            if (data.text && !data.images) {
                html += `<div class="m-text">${data.text}</div>`;
            }
            mContent.innerHTML = html;

            const wrap = mContent.querySelector('.m-video-wrap[data-src]');
            if (wrap) {
                wrap.addEventListener('click', function() {
                    const src = this.dataset.src + (this.dataset.src.includes('?') ? '&' : '?') + 'autoplay=1';
                    this.innerHTML = `<iframe src="${src}" allowfullscreen></iframe>`;
                });
            }
        }
    </script>
